name: integration

concurrency:
  group: '${{ github.workflow }} @ ${{ github.sha }}'
  cancel-in-progress: true

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - stable-*

jobs:
  integration:
    environment: protected # requires manual approval within GitHub Actions to proceed
    env:
      source: "./source"
      python_version: "3.12"
      ansible_version: "devel"
    runs-on: ubuntu-latest
    name: "ansible-test-integration"
    steps:
      - name: Checkout collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.source }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build and install collection
        id: install-collection
        uses: ansible-network/github_actions/.github/actions/build_install_collection@main
        with:
          install_python_dependencies: false
          source_path: ${{ env.source }}

      - uses: ansible/ansible-test-auth@v1

      - name: Create integration config file
        uses: actions/github-script@v7
        env:
            GH_PAT_SECRET: ${{ secrets.ANSIBLE_MCP_GITHUB_PAT }}
            INTEGRATION_CONFIG_PATH: "${{ steps.install-collection.outputs.collection_path }}/tests/integration/integration_config.yml"
        with:
            script: |
                const fs = require('fs');
                const path = require('path');

                // 1. Retrieve data from environment variables
                const secret = process.env.GH_PAT_SECRET;
                const fileName = process.env.INTEGRATION_CONFIG_PATH;

                try {
                    // 2. Write the file
                    fs.writeFileSync(fileName, `github_mcp_pat: ${secret}`, 'utf8');
                    console.log(`Successfully created ${fileName}`);
                } catch (err) {
                    core.setFailed(`Failed to write file: ${err.message}`);
                }

      - name: Install collection ansible.utils
        run: ansible-galaxy collection install ansible.utils -p /home/runner/.ansible/collections/ --force
        shell: bash

      - name: Run integration tests
        uses: ansible-network/github_actions/.github/actions/ansible_test_integration@main
        with:
          collection_path: ${{ steps.install-collection.outputs.collection_path }}
          python_version: ${{ env.python_version }}
          ansible_version: ${{ env.ansible_version }}
          ansible_test_requirement_files: "test-requirements.txt"