name: integration

on:
  push:
    branches:
      - stable-aws-integration
jobs:
  integration:
    env:
      source: "./source"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-version:
          - devel
        python-version:
          - "3.12"
    name: "ansible-test-integration-py${{ matrix.python-version }}-${{ matrix.ansible-version }}"
    steps:
      - name: Checkout collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.source }}

      - name: Build and install collection
        id: install-collection
        uses: abikouo/github_actions/.github/actions/build_install_collection@build_install_031926
        with:
          install_python_dependencies: false
          source_path: ${{ env.source }}

      - uses: ansible/ansible-test-auth@v1

      - name: Create integration config file
        uses: actions/github-script@v7
        env:
            GH_PAT_SECRET: ${{ secrets.ANSIBLE_MCP_GITHUB_PAT }} # Or any variable
            INTEGRATION_CONFIG_PATH: "${{ steps.install-collection.outputs.collection_path }}/tests/integration/integration_config.yml"
        with:
            script: |
                const fs = require('fs');
                const path = require('path');

                // 1. Retrieve data from environment variables
                const secret = process.env.GH_PAT_SECRET;
                const fileName = process.env.INTEGRATION_CONFIG_PATH;

                try {
                    // 2. Write the file
                    fs.writeFileSync(fileName, `github_mcp_pat: ${secret}`, 'utf8');
                    console.log(`Successfully created ${fileName}`);
                } catch (err) {
                    core.setFailed(`Failed to write file: ${err.message}`);
                }
      
      - name: Check if ansible.utils is installed in the expected path
        run: ls -lrt /home/runner/.ansible/collections/ansible_collections/ansible/
        shell: bash

      - name: Run integration tests
        uses: ansible-network/github_actions/.github/actions/ansible_test_integration@main
        with:
          collection_path: ${{ steps.install-collection.outputs.collection_path }}
          python_version: ${{ matrix.python-version }}
          ansible_version: ${{ matrix.ansible-version }}
          ansible_test_requirement_files: "test-requirements.txt"