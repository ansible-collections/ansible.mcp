---
bugfixes:
  - event_query - ``ansible.mcp.tools_info`` emitted ``canonical_facts.server_name``
    with no fallback, so a tool catalog returned without a ``server_name`` produced
    a ``null`` inside ``canonical_facts``. The controller raises ``UnhashableFacts``
    on a ``null`` there and silently discards the whole audit record, which meant
    the earlier top-level ``name`` fix did not take effect for that case
    (https://github.com/ansible-collections/ansible.mcp/pull/70).
minor_changes:
  - event_query - added ``tests/unit/audit/test_event_query_contract.py``, which
    asserts the contract ``awx/main/tasks/host_indirect.py`` imposes on
    ``extensions/audit/event_query.yml`` -- non-null top-level ``name``, a
    non-empty ``canonical_facts`` with no ``null`` at any depth, identity-only
    deduplication keys, and normalised taxonomy values. The checks are static, so
    they need no credentials or live MCP server and run on every change.
