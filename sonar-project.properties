# SonarCloud project configuration for ansible.mcp
# Complete documentation: https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# Must match SonarCloud project key exactly (Analyze new project in UI).
sonar.projectKey=ansible-collections_ansible.mcp
sonar.organization=ansible-collections

sonar.sources=.
sonar.projectName=ansible.mcp

# Populated when CI produces coverage.xml at repo root (see follow-up Sonar coverage PR).
sonar.python.coverage.reportPaths=coverage.xml

sonar.tests=tests/unit,tests/integration
sonar.python.version=3.12
sonar.newCode.referenceBranch=main

sonar.exclusions=tests/**,.tox/**
