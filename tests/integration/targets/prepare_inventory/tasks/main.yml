---
- name: Check if uvx is installed
  ansible.builtin.command: which uvx
  failed_when: false

- name: Create temporary file to generate manifest
  ansible.builtin.tempfile:
    suffix: manifest.json
  register: manifest_path

- name: Generate manifest from template
  ansible.builtin.template:
    src: manifest.json.j2
    dest: "{{ manifest_path.path }}"

- name: Generate inventory file in the expected location
  ansible.builtin.template:
    src: inventory.yml.j2
    dest: "{{ ansible_mcp_inventory_file_path }}"
