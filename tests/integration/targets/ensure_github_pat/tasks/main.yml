---
- name: Set integration test directory path
  ansible.builtin.set_fact:
    integration_path: "{{ role_path | dirname | dirname }}"

- name: List file from target
  ansible.builtin.shell:
    cmd: "find {{ integration_path }} -name '*.*'"
  register: _files


- name: Selected files
  ansible.builtin.debug:
    var: _files.stdout_lines
